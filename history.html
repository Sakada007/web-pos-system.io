<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Mart | Sales History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/darkmode.css" />
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loader-card">
      <div class="loader-ring"></div>
      <p>Loading Mini Mart Console</p>
    </div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-store"></i></div>
        <div>
          <h1>Mini Mart</h1>
          <p>Management</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html" data-nav="dashboard"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
        <a href="products.html" data-nav="products"><i class="fa-solid fa-boxes-stacked"></i><span>Products</span></a>
        <a href="sales.html" data-nav="sales"><i class="fa-solid fa-cash-register"></i><span>Sales</span></a>
        <a href="customers.html" data-nav="customers"><i class="fa-solid fa-users"></i><span>Customers</span></a>
        <a href="history.html" class="active" data-nav="history"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
      </nav>
      <div class="sidebar-footer">
        <button class="ghost-btn" id="themeToggle"><i class="fa-solid fa-moon"></i><span>Dark Mode</span></button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-btn mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <p class="eyebrow">Operations</p>
          <h2>Sales History</h2>
        </div>
        <div class="topbar-actions">
          <div class="status-pill"><i class="fa-solid fa-circle-check"></i> Offline Ready</div>
        </div>
      </header>

      <section class="page-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">Records</p>
            <h3>Invoice History</h3>
          </div>
          <div class="toolbar">
            <input type="text" id="historySearch" placeholder="Invoice, customer or DD/MM/YYYY" />
            <input type="date" id="historyDate" />
            <select id="reportType">
              <option value="sales">Sales Report</option>
              <option value="inventory">Inventory Report</option>
              <option value="profit">Profit & Loss</option>
              <option value="purchases">Purchase History</option>
            </select>
            <button class="primary-btn" id="generateReportBtn">Generate</button>
            <button class="ghost-btn" id="exportCsvBtn"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
            <button class="ghost-btn" id="newPurchaseBtn"><i class="fa-solid fa-truck"></i> New Purchase</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Invoice</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal-card confirm-card">
      <h4>Confirm Action</h4>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button class="ghost-btn" onclick="closeModal('confirmModal')">Cancel</button>
        <button class="primary-btn" id="confirmActionBtn">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="receiptModal">
    <div class="modal-card receipt-card">
      <div class="modal-header">
        <h4>Receipt</h4>
        <button class="icon-btn" onclick="closeModal('receiptModal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="receiptContent"></div>
      <div class="modal-actions">
        <button class="ghost-btn" onclick="closeModal('receiptModal')">Close</button>
        <button class="primary-btn" onclick="printReceipt()"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="purchaseModal">
    <div class="modal-card confirm-card">
      <h4>New Purchase</h4>
      <div style="display:grid;gap:8px;margin-top:8px;">
        <input type="text" id="purchaseSupplier" placeholder="Supplier name" />
        <input type="text" id="purchaseItems" placeholder="Items (comma separated)" />
        <input type="number" id="purchaseTotal" placeholder="Total cost" step="0.01" />
        <input type="date" id="purchaseDate" />
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" onclick="closeModal('purchaseModal')">Cancel</button>
        <button class="primary-btn" id="savePurchaseBtn">Save Purchase</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
